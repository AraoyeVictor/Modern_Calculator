<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <div class="calculator-card">
      <!-- Header Controls: Theme & History Toggles -->
      <header class="calculator-header">
        <div class="brand">
          <span class="brand-dot"></span>
          <span class="brand-title">CalcX</span>
        </div>
        <div class="header-actions">
          <button id="sound-toggle" class="icon-btn" aria-label="Toggle sound effects" title="Toggle audio feedback">
            <svg class="icon sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg class="icon sound-off hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>
          <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle dark/light theme">
            <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="icon sun-icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button id="history-toggle" class="icon-btn" aria-label="Toggle history" title="View calculation history">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display -->
      <div class="display-container" id="display-container" title="Click to copy result">
        <div class="previous-operand" id="previous-operand"></div>
        <div class="current-operand-wrapper">
          <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="copied-toast" id="copied-toast">Copied to clipboard!</div>
      </div>

      <!-- Button Grid -->
      <div class="buttons-grid">
        <!-- Row 1: Actions & Operations -->
        <button class="btn btn-action" data-action="clear-all" title="All Clear (Esc)">AC</button>
        <button class="btn btn-action" data-action="delete" title="Backspace (Backspace)">⌫</button>
        <button class="btn btn-action" data-action="percentage" title="Percentage (%)">%</button>
        <button class="btn btn-operator" data-operation="÷" title="Divide (/)">÷</button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button class="btn btn-number" data-number="7">7</button>
        <button class="btn btn-number" data-number="8">8</button>
        <button class="btn btn-number" data-number="9">9</button>
        <button class="btn btn-operator" data-operation="×" title="Multiply (*)">×</button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button class="btn btn-number" data-number="4">4</button>
        <button class="btn btn-number" data-number="5">5</button>
        <button class="btn btn-number" data-number="6">6</button>
        <button class="btn btn-operator" data-operation="−" title="Subtract (-)">−</button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button class="btn btn-number" data-number="1">1</button>
        <button class="btn btn-number" data-number="2">2</button>
        <button class="btn btn-number" data-number="3">3</button>
        <button class="btn btn-operator" data-operation="+" title="Add (+)">+</button>

        <!-- Row 5: Toggle Sign, 0, Decimal, Equals -->
        <button class="btn btn-number" data-action="toggle-sign" title="Negate (±)">±</button>
        <button class="btn btn-number" data-number="0">0</button>
        <button class="btn btn-number" data-number="." title="Decimal point (.)">.</button>
        <button class="btn btn-equals" data-action="equals" title="Calculate (Enter or =)">=</button>
      </div>

      <!-- History Sidebar / Modal Overlay -->
      <aside class="history-panel" id="history-panel">
        <div class="history-header">
          <h3>History</h3>
          <div class="history-actions">
            <button id="clear-history-btn" class="text-btn" title="Clear all history">Clear</button>
            <button id="close-history-btn" class="icon-btn-small" aria-label="Close history">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="history-list" id="history-list">
          <div class="empty-history">No calculations yet</div>
        </div>
      </aside>
    </div>

    <!-- Quick Keyboard Shortcut Hint -->
    <!-- <footer class="keyboard-hints">
      <span><kbd>0-9</kbd> digits</span>
      <span><kbd>+</kbd><kbd>-</kbd><kbd>*</kbd><kbd>/</kbd> operators</span>
      <span><kbd>Enter</kbd> solve</span>
      <span><kbd>Esc</kbd> clear</span>
    </footer> -->
  </div>

  <script src="script.js"></script>
</body>
</html>
